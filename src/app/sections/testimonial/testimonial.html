<section class="testimonial-panel panel-card">
  <div class="panel-heading">
    <span class="quote-icon">"</span>
    <h2>Lo que dicen sobre mi trabajo</h2>
  </div>
  <div class="testimonial-content" #contentDiv [style.min-height]="maxHeight">
    <blockquote>{{ Testimonials[currentIndex].comentario }}</blockquote>
    <div class="author-row">
      <div class="avatar"><i class="bi bi-person-fill"></i></div>
      <div><strong>{{ Testimonials[currentIndex].autor }}</strong><span>{{ Testimonials[currentIndex].empresa }}</span></div>
    </div>
  </div>
  <div class="dots">
    @for (testimonial of Testimonials; track $index) {
      <span [class.active]="isActive($index)" (click)="goToTestimonial($index)" class="dot-button"></span>
    }
  </div>
</section>
