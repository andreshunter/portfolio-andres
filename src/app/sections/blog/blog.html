<section id="blog" class="blog-panel panel-card">
  <div class="panel-heading">
    <span class="heading-icon"><i class="bi bi-journal-text"></i></span>
    <h2>Último artículo</h2>
  </div>
  <article class="article-card">
    <div class="article-visual">
      <img src="assets/images/brain-ai-transparent.png" alt="Inteligencia artificial y datos">
      <span>DATA + AI</span>
    </div>
    <div class="article-copy">
      <span class="article-date">{{ article.date }}</span>
      <h3>{{ article.title }}</h3>
      <p>{{ article.excerpt }}</p>
      <a href="#contact">Leer artículo <i class="bi bi-arrow-right"></i></a>
    </div>
  </article>
</section>
