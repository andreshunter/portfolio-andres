<section id="skills" class="skills panel-card">
  <div class="panel-heading"><span><i class="bi bi-code-slash" style="font-size: 25px;"></i></span><h2>Habilidades Técnicas</h2></div>
  <div class="skills-grid">
    @for (tech of technologies; track tech.name) {
      <div class="skill-card"><img [src]="tech.image" [alt]="tech.name"><span>{{ tech.name }}</span></div>
    }
  </div>
</section>
