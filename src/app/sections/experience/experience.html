<section class="experience">
    <div class="container">
        <div class="title">
            <span>Experiencia</span>
            <h2>Mi trayectoria</h2>
            <p>
                Formación, proyectos y experiencia en tecnologías de datos e inteligencia artificial.
            </p>
        </div>
        <div class="timeline">
            @for (item of experiences; track item.title) {
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <span class="year">
                            {{ item.year }}
                        </span>
                        <h3>{{ item.title }}</h3>
                        <h4>{{ item.company }}</h4>
                        <p >
                            {{ item.description }}
                        </p>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
