<app-navbar (contactRequested)="openContactModal()"></app-navbar>

<main class="portfolio-shell">
  <section class="dashboard-top">
    <div class="hero-slot"><app-hero (contactRequested)="openContactModal()"></app-hero></div>

    <aside class="sidebar-top">
      <app-about></app-about>
      <app-services [compact]="true"></app-services>
    </aside>
  </section>

  <app-projects></app-projects>

  <section class="dashboard-middle">
    <div class="left-middle-column">
      <app-testimonial></app-testimonial>
      <app-skills></app-skills>
    </div>

    <div class="experience-slot">
      <app-experience></app-experience>
    </div>
  </section>

  <section class="full-section"><app-certificates></app-certificates></section>
  <!-- <section class="full-section"><app-contact></app-contact></section> -->
</main>

<app-footer (contactRequested)="openContactModal()"></app-footer>

@if (contactModalOpen) {
  <app-contact-modal (closed)="closeContactModal()"></app-contact-modal>
}
